schema_version: "1.0"
pilot_geography: "Pune District, Maharashtra, India"
notes:
  - "Do not invent stations, vehicle counts, site costs, or grid headroom."
  - "Keep conditional, restricted, and unverified sources explicitly labelled."

sources:
  - source_id: "SRC-OSM-01"
    source_name: "OpenStreetMap (Overpass / Geofabrik)"
    official_url: "https://www.openstreetmap.org"
    access_classification: "OPEN"
    licence_or_access_basis: "ODbL (attribution and share-alike required)"
    geographic_coverage: "Pune District / Maharashtra / India"
    update_frequency: "Continuous community updates"
    retrieval_date: "2026-11-27"
    data_used_for: "Roads, toll plazas, fuel outlets, POIs, and public charger records"
    limitations: "Community data may have missing tags or duplicates; requires validation."

  - source_id: "SRC-OGD-02"
    source_name: "OGD Platform India"
    official_url: "https://www.data.gov.in"
    access_classification: "OPEN"
    licence_or_access_basis: "Dataset-specific licence (commonly GODL-India); verify per dataset"
    geographic_coverage: "India / State / District level"
    update_frequency: "Varies by publishing dataset"
    retrieval_date: "2026-11-27"
    data_used_for: "Supplementary open public datasets"
    limitations: "Check individual dataset licence, date coverage, and terms."

  - source_id: "SRC-VAHAN-03"
    source_name: "VAHAN 4 Dashboard (MoRTH)"
    official_url: "https://vahan.parivahan.gov.in"
    access_classification: "CONDITIONAL"
    licence_or_access_basis: "Permitted aggregate exports/views only; no open bulk API assumed"
    geographic_coverage: "Pune RTOs (MH-12 / MH-61, MH-14, MH-42) and state/national series"
    update_frequency: "Periodic / snapshot-based"
    retrieval_date: "2026-11-27"
    data_used_for: "Registered EV counts by RTO and vehicle segment"
    limitations: "Do not assume open bulk API or breach terms; track MH-12 to MH-61 shift and snapshot dates."

  - source_id: "SRC-EVYATRA-04"
    source_name: "BEE EV-Yatra Portal"
    official_url: "https://evyatra.beeindia.gov.in"
    access_classification: "CONDITIONAL"
    licence_or_access_basis: "Public directory; confirm bulk-download/reuse terms before large collection"
    geographic_coverage: "India / Maharashtra / Pune"
    update_frequency: "Periodic directory updates"
    retrieval_date: "2026-11-27"
    data_used_for: "Public charger directory cross-check"
    limitations: "Reported status is not independent verification; check duplicates with OSM."

  - source_id: "SRC-CPO-05"
    source_name: "Charge Point Operator Feeds (Tata Power, Statiq, Jio-bp, Ather)"
    official_url: "https://evyatra.beeindia.gov.in"
    access_classification: "RESTRICTED"
    licence_or_access_basis: "Requires operator permission, partnership, or agreed feed (e.g., OCPI)"
    geographic_coverage: "Operator network coverage"
    update_frequency: "Operator-controlled"
    retrieval_date: "2026-11-27"
    data_used_for: "Live status, connector details, and session data (only if permitted)"
    limitations: "Restricted access; do not treat unverified or restricted feeds as open."

  - source_id: "SRC-MSEDCL-06"
    source_name: "MSEDCL / DISCOM Feeder & Substation Data"
    official_url: "https://www.mahadiscom.in"
    access_classification: "RESTRICTED"
    licence_or_access_basis: "Requires formal permission / data-sharing agreement or MoU"
    geographic_coverage: "Pune / Maharashtra distribution network"
    update_frequency: "Utility-controlled"
    retrieval_date: "2026-11-27"
    data_used_for: "Substation proximity and feeder headroom screening"
    limitations: "Restricted grid data; keep missing grid evidence as unknown (never zero)."

  - source_id: "SRC-PMPML-07"
    source_name: "PMPML Fleet & Depot Information"
    official_url: "https://www.pmpml.org"
    access_classification: "UNVERIFIED"
    licence_or_access_basis: "Public reports need direct confirmation from PMPML"
    geographic_coverage: "Pune / PCMC municipal bus depots and routes"
    update_frequency: "To be confirmed"
    retrieval_date: "2026-11-27"
    data_used_for: "E-bus fleet counts, depot locations, and operational context"
    limitations: "Published e-bus counts vary across sources; confirm directly before model use."

  - source_id: "SRC-POLICY-08"
    source_name: "MHI / MoP / BEE / ICAT / ARAI Public Guidelines & Benchmarks"
    official_url: "https://heavyindustries.gov.in"
    access_classification: "OPEN"
    licence_or_access_basis: "Public government notifications, guidelines, and published reports"
    geographic_coverage: "National / Maharashtra"
    update_frequency: "As published"
    retrieval_date: "2026-11-27"
    data_used_for: "Scheme context, standards, and technical benchmark references"
    limitations: "Confirm exact dataset/benchmark terms before using as calibrated Pune values."

  - source_id: "SRC-GATISHAKTI-09"
    source_name: "PM Gati Shakti (National Master Plan)"
    official_url: "https://pmgatishakti.gov.in"
    access_classification: "UNVERIFIED"
    licence_or_access_basis: "External portal access and layer terms unverified for MVP"
    geographic_coverage: "National infrastructure & logistics layers"
    update_frequency: "To be verified"
    retrieval_date: "2026-11-27"
    data_used_for: "Future multi-modal / logistics co-location reference"
    limitations: "Unverified external access; keep as unverified until confirmed."
