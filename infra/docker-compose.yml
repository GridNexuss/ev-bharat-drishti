services:
  db:
    image: postgis/postgis:16-3.7
    container_name: evbharat-postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evbharat}
      POSTGRES_USER: ${POSTGRES_USER:-evbharat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env file}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-evbharat} -d ${POSTGRES_DB:-evbharat}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
